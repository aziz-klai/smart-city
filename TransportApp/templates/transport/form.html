{% extends 'transport/base_transport.html' %}
{% block title %}{{ titre }}{% endblock %}
{% block content %}
<h2>{{ titre }}</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <p>
            <label>{{ field.label }}</label><br>
            {{ field }}
            {{ field.errors }}
        </p>
    {% endfor %}
    <button class="btn" type="submit">Enregistrer</button>
    <a class="btn btn-gray" href="{% url 'liste_transports' %}">Annuler</a>
</form>
{% endblock %}
