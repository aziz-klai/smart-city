<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Transport{% endblock %} - Smart City</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f7fa; margin: 0; color: #1f2d3d; }
        header { background: #13729e; color: white; padding: 16px 32px; font-size: 20px; font-weight: bold; }
        main { max-width: 900px; margin: 24px auto; background: white; padding: 24px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th { background: #b4c4e4; text-align: left; }
        th, td { padding: 10px; border-bottom: 1px solid #dde6ee; }
        .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: none;
               color: white; text-decoration: none; cursor: pointer; font-size: 14px; background: #13729e; }
        .btn-warning { background: #e0a800; }
        .btn-danger { background: #d9534f; }
        .btn-gray { background: #6c757d; }
        .msg { padding: 10px; background: #d4edda; border-radius: 6px; margin-bottom: 12px; }
        .errorlist { color: #c0392b; list-style: none; padding: 0; margin: 4px 0; }
        form p { margin: 14px 0; }
        input, select { padding: 8px; width: 100%; max-width: 360px; box-sizing: border-box; }
        .top { display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 3px 8px; border-radius: 10px; color: white; font-size: 12px; }
        .actif { background: #28a745; } .maintenance { background: #e0a800; } .hors_service { background: #d9534f; }
    </style>
</head>
<body>
    <header>Smart City : Gestion du transport</header>
    <main>
        {% if messages %}
            {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
