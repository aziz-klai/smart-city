{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart City{% endblock %} · Smart City</title>
  <link rel="icon" href="{% static 'img/logo.svg' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="{% url 'Evenement:liste_evenement' %}">
        <img src="{% static 'img/logo.svg' %}" alt="Smart City">
        <div><b>Smart City</b><small>Gestion municipale</small></div>
      </a>
      <nav class="nav">
        <div class="nav-label">Général</div>
        <a href="{% url 'Evenement:liste_evenement' %}">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          Tableau de bord
        </a>
        <div class="nav-label">Modules métier</div>
        <a href="{% url 'Evenement:liste_evenement' %}" class="active">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Événements
        </a>
      </nav>
      <div class="side-foot">
        <span class="avatar">AB</span>
        <div class="who"><b>Ahmed Ben Salah</b><small>Administrateur</small></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <form class="topsearch" action="#">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input name="q" placeholder="Rechercher un bâtiment, un événement, une ligne, un document…">
          <kbd>Ctrl K</kbd>
        </form>
        <div class="top-actions">
          <a class="icon-btn" href="#" title="Notifications">
            <svg class="i" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>
            <span class="dot"></span>
          </a>
          <div class="top-user"><span class="avatar">AB</span><div><b>Ahmed Ben Salah</b><small>Administrateur</small></div></div>
        </div>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
